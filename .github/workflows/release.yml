name: Release

on:
  push:
    branches: [main]

# Prevent overlapping runs from racing on tag/version pushes.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    # macos-latest is Apple Silicon (macos-14+), needed for arm64 dmg.
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Default GITHUB_TOKEN; its pushes won't retrigger workflows.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump minor version, commit, and tag
        id: bump
        run: |
          npm version minor -m "chore(release): %s [skip ci]"
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Push commit and tag to main
        run: git push --follow-tags origin HEAD:main

      - name: Build (electron-vite + electron-builder)
        # Inline the steps from `npm run build` so we can pass `--publish never`
        # to electron-builder. Without it, electron-builder detects CI and tries
        # to auto-publish to GitHub, which requires GH_TOKEN and fails. We
        # publish ourselves in the next step via softprops/action-gh-release.
        run: |
          npm run clean
          npx electron-vite build
          npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Create GitHub Release with dmg attached
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.bump.outputs.version }}
          name: v${{ steps.bump.outputs.version }}
          generate_release_notes: true
          files: dist/ground-control-${{ steps.bump.outputs.version }}-arm64.dmg
