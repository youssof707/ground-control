name: Release

on:
  push:
    branches: [main]

# Prevent overlapping runs from racing on tag/version pushes.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    # macos-latest is Apple Silicon (macos-14+), needed for arm64 dmg.
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Default GITHUB_TOKEN; its pushes won't retrigger workflows.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump minor version, commit, and tag
        id: bump
        run: |
          npm version minor -m "chore(release): %s [skip ci]"
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Push commit and tag to main
        run: git push --follow-tags origin HEAD:main

      - name: Write notarization API key
        run: echo "$APPLE_API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}

      - name: Build, sign, and notarize
        run: |
          npm run clean
          npx electron-vite build
          npx electron-builder --publish never
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ runner.temp }}/AuthKey.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

      - name: Verify Gatekeeper accepts the build
        run: |
          APP="dist/mac-arm64/Ground Control.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          xcrun stapler validate "$APP"
          spctl --assess --type execute --verbose=4 "$APP"
          codesign -dv "$APP" 2>&1 | grep -q "TeamIdentifier=${{ secrets.APPLE_TEAM_ID }}"

      - name: Add stable-named dmg for website downloads
        run: cp "dist/ground-control-${{ steps.bump.outputs.version }}-arm64.dmg" dist/ground-control-arm64.dmg

      - name: Remove notarization API key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"

      - name: Create GitHub Release with dmg attached
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.bump.outputs.version }}
          name: v${{ steps.bump.outputs.version }}
          generate_release_notes: true
          files: |
            dist/ground-control-${{ steps.bump.outputs.version }}-arm64.dmg
            dist/ground-control-arm64.dmg
